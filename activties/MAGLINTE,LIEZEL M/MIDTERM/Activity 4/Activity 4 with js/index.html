<!DOCTYPE html>
<head>
    <title>My Simple Calculator</title>
    <link rel="stylesheet" href="css/calculator-styles.css" type="text/css"/>
    <script src="js/calculator.js" type="text/javascript"></script>
    </head>
    <body>
        
        <form action="../../../../page/blog.html" method="POST" style="margin-left: -1450px; margin-top: -700px;">
            <input type="submit" value="Go Back"/>
        </form>
        <div class="main">
            <h2 id="headingTitle">My Simple Calculator</h2>
        <table>
            <tr>
                <td class="form-label"><label>NUM1:</label></td>
                <td><input type="text" id="txtNum1"></td>
            </tr>
            <tr>
                <td class="form-label"><label>NUM2:</label></td>
                <td><input type="text" id="txtNum2"></td>
            </tr>
        </div>
        </table>
             <div class="btn">
                <input type="button" value="+" id="btnAdd" onclick="getSum();">
                <input type="button" value="-" id="btnMinus" onclick="getDiff();">
                <input type="button" value="*" id="btnMultiply" onclick="getMulti();">
                <input type="button" value="/" id="btnDivide" onclick="getDivide();">
                <input type="button" id="btnClear" value="CLEAR" onclick="btnClear1();">
            </div>
        
        
        
    </body>
</head>
</html>
