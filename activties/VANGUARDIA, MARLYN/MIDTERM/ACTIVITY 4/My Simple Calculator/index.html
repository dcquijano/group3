<!DOCTYPE html>
    <link href="css/calculator-style.css" type="text/css" rel="stylesheet" />
    <head>
        <title>My Simple Calculator</title>
    </head>
<body>

    <form action="../../../../../page/blog.html" method="POST" style="margin-left: -1450px; margin-top: -700px;">
        <input type="submit" value="Go Back"/>
    </form>

     <div class="main">
        <h2><center>My Simple Calculator</center></h2> 
        <table>
            <tr>
                <td> <label class="form-label">Num1</label></td>
                <td> <input type="text" id="txtNum1"> </td>
            </tr>
            <tr>
                <td> <label class="form-label">Num2</label></td>
                <td> <input type="text" id="txtNum2"> </td>
            </tr>
        </table>
        <br>
        <div class="btn"> 
            <input type="button" value="+" onclick="addNumbers()">
            <input type="button" value="-" onclick="subtractNumbers()">
            <input type="button" value="*" onclick="multiplyNumbers()">
            <input type="button" value="/" onclick="divideNumbers()">
            <input type="button" id="btnClear" value="CLEAR" onclick="clearTextboxes()">

            <script src="js/calculator-script.js" type="text/javascript"  ></script>
        </div>
    </div>
    
</body>
</html>
